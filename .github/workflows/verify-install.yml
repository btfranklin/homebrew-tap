name: Verify public bottle installation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  verify:
    name: Verify public install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    steps:
      - name: Prepare container workspace
        if: runner.os == 'Linux'
        run: sudo chmod -R a+rwX "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Fetch public tap helper
        run: |
          helper_path="$RUNNER_TEMP/tap-source"
          git init "$helper_path"
          git -C "$helper_path" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$helper_path" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$helper_path" checkout --detach FETCH_HEAD

      - name: Update stable Homebrew
        env:
          HOMEBREW_UPDATE_TO_TAG: 1
        run: brew update

      - name: Prepare Linux verification interpreter
        if: runner.os == 'Linux'
        run: brew install python

      - name: Verify public bottle installation
        working-directory: ${{ runner.temp }}
        env:
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_UPDATE_TO_TAG: 1
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            python_command="$(brew --prefix python)/libexec/bin/python3"
          fi
          "$python_command" "$RUNNER_TEMP/tap-source/scripts/verify-public-install.py"
