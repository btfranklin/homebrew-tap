name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Formula pull request number
        required: true
        type: string
      head_sha:
        description: Reviewed 40-character pull request head SHA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        # Homebrew/actions has date-based releases and no major-version tag.
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        id: git-setup
        uses: Homebrew/actions/git-user-config@main

      - name: Validate reviewed pull request head
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "head_sha must be a 40-character commit SHA." >&2
            exit 1
          fi

      - name: Build and publish bottles
        id: pr-pull
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-setup.outputs.email }}
        run: |
          brew pr-pull \
            --debug \
            --retain-bottle-dir \
            --tap="$GITHUB_REPOSITORY" \
            --head-sha="$HEAD_SHA" \
            "$PULL_REQUEST"

      - name: Attest bottle files
        uses: actions/attest@v4
        with:
          subject-path: "${{ steps.pr-pull.outputs.bottle_path }}/*.tar.gz"

      - name: Push formula and bottles
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: main
