name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: Test formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        # Homebrew/actions has date-based releases and no major-version tag.
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean previous bottle files
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Test formula
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Upload bottle artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: ignore
          retention-days: 5
