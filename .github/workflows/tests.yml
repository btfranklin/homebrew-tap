name: Build and test bottles

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/publish.yml"
      - "scripts/check-bottles.py"
      - "tests/**"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: Test formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        # Homebrew/actions has date-based releases and no major-version tag.
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean previous bottle files
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Test bottle validation
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s "$(brew --repository btfranklin/tap)/tests" -p 'test_*.py'

      - name: Test formula
        run: brew test-bot --only-formulae btfranklin/tap/perfect-doc

      - name: Require a tested bottle
        run: |
          compgen -G '*.bottle*.tar.gz'
          compgen -G '*.bottle.json'

      - name: Upload bottle artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
          retention-days: 14
