name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: Test formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Prepare Intel Rust compiler
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup update stable --no-self-update
          rustup run stable rustc --version
          rustup run stable cargo --version
          compiler_bin="$(dirname "$(rustup which --toolchain stable rustc)")"
          printf 'PERFECT_DOC_RUST_BIN=%s\n' "$compiler_bin" >> "$GITHUB_ENV"

      - name: Set up Homebrew
        id: set-up-homebrew
        # Homebrew/actions has date-based releases and no major-version tag.
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean previous bottle files
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Test formula
        if: github.event_name == 'pull_request' && matrix.os != 'macos-15-intel'
        run: brew test-bot --only-formulae

      - name: Build and test the Intel bottle
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        run: |
          # Homebrew has no Intel Rust bottle. Use the official stable toolchain.
          export PATH="$PERFECT_DOC_RUST_BIN:$PATH"
          rustc --version
          cargo --version
          # The only dependency is the build compiler supplied above.
          brew info --json=v2 --formula btfranklin/tap/perfect-doc | python3 -c '
          import json, sys
          formula = json.load(sys.stdin)["formulae"][0]
          assert formula["build_dependencies"] == ["rust"], formula
          assert not formula["dependencies"], formula
          assert not formula["test_dependencies"], formula
          '
          brew install --build-bottle --ignore-dependencies btfranklin/tap/perfect-doc
          brew audit --strict --online --formula btfranklin/tap/perfect-doc
          brew bottle --json --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/perfect-doc-$(brew list --versions perfect-doc | awk '{print $2}')" btfranklin/tap/perfect-doc
          brew uninstall perfect-doc
          brew install ./perfect-doc--*.bottle.tar.gz
          brew linkage --test perfect-doc
          brew test perfect-doc

      - name: Require a tested bottle
        if: github.event_name == 'pull_request'
        run: |
          compgen -G '*.bottle.tar.gz'
          compgen -G '*.bottle.json'

      - name: Upload bottle artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
          retention-days: 5
